name: External AI Acceptance

# Manual only — never runs on every push/PR (these are paid providers).
# Missing credentials report SKIPPED_NO_CREDENTIALS, never a fake pass
# and never a CI failure just for being absent.
on:
  workflow_dispatch: {}

jobs:
  external-ai-acceptance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyondstyle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/beyondstyle_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run external AI acceptance (make external-ai-e2e)
        run: make external-ai-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-ai-acceptance-evidence
          path: docs/evidence/external-ai-acceptance.json
          if-no-files-found: ignore
